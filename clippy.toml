# WHY: project-specific clippy thresholds that workspace lints alone cannot
# express. Standards ref: REPO-SETUP.md#root-files

# Keep complex types under control. Default is 250; 200 leaves room for
# tuple return types in crypto/codec code while still catching gratuitous
# generics soup.
type-complexity-threshold = 200

# Disallowed types — intentionally empty for now. Add project-specific
# entries here as needed; see:
# https://rust-lang.github.io/rust-clippy/master/#disallowed_types
disallowed-types = []
