# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0119", reason = "number_prefix unmaintained, transitive via indicatif; no safe upgrade" },
]

[licenses]
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "AGPL-3.0-only",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
skip = [
    # thiserror: prost uses 1.x, workspace uses 2.x
    { name = "thiserror", version = "1" },
    { name = "thiserror", version = "2" },
    { name = "thiserror-impl", version = "1" },
    { name = "thiserror-impl", version = "2" },
    { name = "getrandom", version = "=0.2.17" },
    { name = "rand_core", version = "=0.6.4" },
    { name = "windows-sys", version = "=0.59.0" },
]
