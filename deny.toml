[graph]
targets = []
all-features = false

[advisories]

# WHY: keep in sync with .cargo/audit.toml's [advisories.ignore] array.
# cargo-audit does not read deny.toml, so any ignore lives in both files.

[[advisories.ignore]]
id = "RUSTSEC-2025-0119"
reason = "number_prefix unmaintained, transitive via indicatif; no safe upgrade available upstream."

[[advisories.ignore]]
id = "RUSTSEC-2026-0097"
reason = "rand 0.9.2 unsound only when a custom logger re-enters rand::rng(); akroasis uses tracing-subscriber with no custom logger that calls into rand, so the condition is unreachable. Pulled in transitively via ulid 1.2.1 (semaino/koinon/syntonia/kryphos/kerykeion) and proptest 1.11.0 (dev-only)."

[licenses]
# WHY: AGPL-3.0-only is the workspace license itself (declared in
# workspace.package). MPL-2.0, BSL-1.0, CC0-1.0 cover permissive
# transitive licenses surfaced by the dep tree.
allow = [
    "MIT",
    "Apache-2.0",
    "AGPL-3.0-only",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

# WHY an exception rather than adding NCSA to `allow` above: libfuzzer-sys is
# `(MIT OR Apache-2.0) AND NCSA` because it wraps LLVM's libFuzzer, which
# predates LLVM's relicensing. NCSA is permissive, OSI-approved, FSF
# Free/Libre and compatible with this workspace's AGPL-3.0 — but it is
# compatible for THIS dependency, and a global allow would silently accept it
# from any future crate in the runtime graph as well. The exception keeps the
# grant attached to the crate that needs it.
#
# It applies to the detached `fuzz/` workspace only; nothing in the shipped
# runtime graph depends on libfuzzer-sys (forkwright/akroasis#95).
[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# WHY: known transitive duplicates from incompatible upstream ranges.
# thiserror: prost stays on 1.x while the workspace uses 2.x.
# getrandom/rand_core/windows-sys: pinned versions surface alongside
# their newer counterparts via tokio/rustls/figment chains.
skip = [
    { name = "thiserror", version = "1" },
    { name = "thiserror", version = "2" },
    { name = "thiserror-impl", version = "1" },
    { name = "thiserror-impl", version = "2" },
    { name = "getrandom", version = "=0.2.17" },
    { name = "rand_core", version = "=0.6.4" },
    { name = "windows-sys", version = "=0.59.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
