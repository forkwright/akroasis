# WHY a caller rather than a local copy: this logic guards auto-merge, and a
# copy is how this repo's version drifted from the fixed one — it kept an
# `exit 0` on the refusal path long after the canonical workflow had corrected
# it to `exit 1`, so the guard printed a refusal and then merged
# (forkwright/akroasis#371). One implementation, one place to fix.
name: Dependabot Auto-Merge

on:
  pull_request:

# WHY declared here as well as in the reusable: a called workflow's permissions
# can only narrow what the caller grants, never widen it. Stating them at the
# caller keeps the ceiling visible in the repo that owns the risk rather than
# only in another repository's file.
permissions:
  contents: write
  pull-requests: write

# WHY a caller-level concurrency block here, when gate-attestation.yml
# deliberately has none: the two reusables differ. hybrid-gate.yml declares its
# own concurrency, so a caller-level duplicate would self-cancel the shared
# group. This one declares none, so without this block a superseded push to a
# dependabot PR leaves its earlier run racing the newer one — both waiting on
# checks, both able to merge. Do not "harmonise" these two files.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # WHY(#376) pinned: a branch ref is moved by whoever pushes to
    # forkwright/.github, so an unpinned call changes what this repo merges on
    # with no commit here to review or blame.
    #
    # WARNING: nothing bumps this pin. forkwright/.github publishes no tags, so
    # dependabot has no version to compare the SHA against and leaves it alone,
    # even though it is otherwise active in this repo. The pin therefore freezes
    # until someone moves it by hand, which is how this repo sat on a revision
    # predating the auto-merge race fix while its own CI reported green.
    #
    # WHY no `secrets: inherit`, when gate-attestation.yml does inherit: that
    # keyword forwards EVERY repository secret to a workflow in another
    # repository, and this one reads `secrets.GITHUB_TOKEN` and nothing else —
    # which a called workflow receives regardless. Inheriting here would widen
    # the blast radius of a change to forkwright/.github for no capability.
    uses: forkwright/.github/.github/workflows/dependabot-auto-merge.yml@main
