name: Gate verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for bot PR
        id: bot-check
        run: |
          author="${{ github.event.pull_request.user.login }}"
          if [[ "$author" == *"[bot]" || "$author" == "dependabot"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping gate check for bot author: $author"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Gate-Passed trailer
        if: steps.bot-check.outputs.skip != 'true'
        run: |
          commits=$(git log --format="%H" origin/main..HEAD)
          if [ -z "$commits" ]; then
            echo "No commits in PR"
            exit 1
          fi

          found=false
          for sha in $commits; do
            body=$(git log -1 --format="%b" "$sha")
            if echo "$body" | grep -q "^Gate-Passed: kanon"; then
              version=$(echo "$body" | grep "^Gate-Passed:" | head -1)
              echo "Found gate attestation: $version"
              found=true
              break
            fi
          done

          if [ "$found" = false ]; then
            echo "::error::No Gate-Passed trailer found in PR commits."
            echo "Run kanon gate locally before pushing."
            exit 1
          fi

