# WHY: Block merges on known vulnerabilities and license/source/ban
# violations. Runs `cargo audit` (RustSec DB) and `cargo deny check`
# (licenses, sources, bans, advisories) on every PR and daily against main
# so newly-published CVEs against existing deps are caught even when no PR
# is open. See standards/CI.md § Vulnerability scanning.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # NOTE: Daily at 05:23 CST (11:23 UTC). Off-peak minute per global
    # rule about avoiding :00/:30 cron schedules. Non-overlapping with
    # stale (Sun 06:00 CST).
    - cron: "23 11 * * *"
  workflow_dispatch:

# PROJECT: explicit top-level default deny; job-level permissions grant only what's needed
permissions:
  contents: read

# WHY the SHA on a push (#375): `github.event.pull_request.number` is empty
# on a `push` event, so the old key here fell back to `github.ref`, constant
# for `main` -- two pushes to main inside the cancel window collided, and
# `cargo audit`/`cargo deny` reported `cancelled`, not red, for the loser.
# Confirmed live on 60f97de and b5c8071 (`gh api
# repos/forkwright/akroasis/commits/<sha>/check-runs`), the same two commits
# `gate-attestation.yml`'s identical fix cites as its own evidence -- this
# file carries the exact same bug, standalone (no reusable-workflow fallback
# to catch it). `schedule`/`workflow_dispatch` keep falling back to
# `github.ref`: a superseding scheduled/manual run cancelling an older one of
# its own kind is the desired behavior, unchanged here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    # WHY: checks licenses, banned crates, source registries, and the
    # RustSec advisory DB using deny.toml's ignore list. Any finding fails
    # the job — suppressions require a deny.toml entry with a WHY comment,
    # not silent --ignore flags.
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false # PROJECT: security hardening — never expose token to steps
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # WHY: run every check explicitly so a schema regression in one
          # section can't silently disable the others. cargo-deny expects
          # the check subcommand followed by space-separated check names;
          # `arguments:` passes post-subcommand flags only.
          command: check advisories licenses bans sources
          arguments: --all-features

      # WHY a second invocation rather than a wider first one: `fuzz/` declares
      # its own [workspace], so the root run resolves a graph that does not
      # contain it. cargo-deny follows the manifest it is given and there is no
      # flag that makes one run span two workspaces.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
          arguments: --all-features
          # WHY the action's own input rather than a flag in `arguments`: the
          # action always passes `--manifest-path` from this input (defaulting
          # to ./Cargo.toml), so putting one in `arguments` supplies the flag
          # twice and cargo-deny rejects it outright.
          manifest-path: fuzz/Cargo.toml

  cargo-audit:
    # WHY: cargo-deny's advisories check overlaps but uses a different code
    # path; running cargo-audit independently protects against bugs or
    # config drift disabling one of the two. See standards/CI.md.
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22
      - name: cargo audit
        # WHY: -D unmaintained,unsound,yanked escalates those categories
        # to errors (default is warning only). Suppressions go through
        # .cargo/audit.toml, which mirrors deny.toml's [[advisories.ignore]]
        # entries — no silent --ignore flags here.
        run: cargo audit --deny unmaintained --deny unsound --deny yanked
      - name: cargo audit (fuzz workspace)
        # WHY separate: cargo-audit reads one lockfile, and `fuzz/` has its own
        # because it is a detached workspace. Without this its dependency tree
        # is scanned by nothing.
        run: cargo audit --file fuzz/Cargo.lock --deny unmaintained --deny unsound --deny yanked

  osv-scanner:
    name: osv-scanner
    # WHY: google/osv-scanner-action's reusable workflow startup-fails when
    # invoked from this repo (and hardcodes runner policy kanon rejects) —
    # run the pinned scanner directly, per kanon's fleet-canonical pattern.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install pinned osv-scanner
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version | grep -q '^osv-scanner version: 2\.3\.8$' || {
            echo "ERROR: downloaded binary version mismatch" >&2; exit 1; }
          echo "/tmp" >> "$GITHUB_PATH"
      - name: osv scanner
        # WHY both lockfiles named explicitly: `fuzz/` is a detached workspace
        # with its own lockfile, and a single `--lockfile` covers only the graph
        # it names.
        run: |
          osv-scanner scan source --config=osv-scanner.toml \
            --lockfile=Cargo.lock --lockfile=fuzz/Cargo.lock
