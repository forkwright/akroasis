[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/forkwright/akroasis"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
snafu = "0.8"

# Async
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
jiff = { version = "0.2", features = ["serde"] }

# IDs
ulid = { version = "1", features = ["serde"] }

# String optimisation
compact_str = { version = "0.8", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }

# Crypto
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
argon2 = { version = "0.5", features = ["zeroize"] }
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"

# Hashing
blake3 = "1"

# Binary serialization
ciborium = "0.2"

# CSV
csv = "1"

# TOML serialization
toml = { version = "0.8", features = ["preserve_order"] }

# Serial
serialport = "4"

# Embedded KV store
fjall = "3"

# File locking
fs2 = "0.4"

# Password input
rpassword = "7"

# Testing
tempfile = "3"

# Mesh networking — serial
tokio-serial = { version = "5.4.5", default-features = false }
tokio-util = { version = "0.7.18", features = ["codec"] }
bytes = "1"

# Mesh networking — BLE
btleplug = "0.12.0"
uuid = { version = "1", features = ["v4"] }

# Mesh networking — protobuf
prost = "0.14.3"
prost-types = "0.14.3"

# Mesh networking — crypto (pin exact: pre-release)
aes = "=0.9.0-rc.4"
ctr = "=0.10.0-rc.4"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

# Mesh networking — graph
petgraph = { version = "0.8.3", features = ["serde-1"] }

# Mesh networking — discovery
mdns-sd = "0.18.2"
rusb = "0.9.4"

# Testing
proptest = "1"
nix = { version = "0.31.2", features = ["pty"] }
