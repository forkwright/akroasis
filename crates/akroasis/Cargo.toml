[package]
name = "akroasis"
description = "ἀκρόασις — attentive reception. RF intelligence, mesh networking, and communications sovereignty."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "akroasis_lib"
path = "src/lib.rs"

[[bin]]
name = "akroasis"
path = "src/main.rs"

[features]
# Opt-in live serial radio detection. Kept off by default so default builds do
# not require native serial dependencies.
hardware-serial = ["syntonia/hardware-serial"]

[dependencies]
clap = { workspace = true }
comfy-table = "8"
csv = { workspace = true }
dialoguer = "0.11"
figment = { workspace = true }
indicatif = "0.17"
jiff = { workspace = true }
kerykeion = { path = "../kerykeion" }
koinon = { path = "../koinon" }
kryphos = { path = "../kryphos" }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
syntonia = { path = "../syntonia" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
syn = { version = "3", features = ["full", "visit"] }

[lints]
workspace = true
