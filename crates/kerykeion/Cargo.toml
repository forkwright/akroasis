tokio-util = { workspace = true }
bytes = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
futures = { workspace = true }
rand_core = { workspace = true }
petgraph = { workspace = true }

[build-dependencies]
prost-build = "0.14.3"

[dev-dependencies]
proptest = { workspace = true }
# WHY: test-util provides tokio::time::pause/advance for deterministic async timing tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
