syntax = "proto3";
package meshtastic;

// Device hardware metrics reported via telemetry.
message DeviceMetrics {
  uint32 battery_level = 1;
  float voltage = 2;
  float channel_utilization = 3;
  float air_util_tx = 4;
  uint32 uptime_seconds = 6;
}

// Environmental sensor data.
message EnvironmentMetrics {
  float temperature = 1;
  float relative_humidity = 2;
  float barometric_pressure = 3;
  float gas_resistance = 4;
  float voltage = 5;
  float current = 6;
  uint32 iaq = 7;
  float distance = 8;
  float lux = 9;
  float white_lux = 10;
  float ir_lux = 11;
  float uv_lux = 12;
  float wind_direction = 13;
  float wind_speed = 14;
  bool has_iaq = 15;
}

// Container for all telemetry variants.
message Telemetry {
  uint32 time = 1;
  oneof variant {
    DeviceMetrics device_metrics = 2;
    EnvironmentMetrics environment_metrics = 3;
  }
}
