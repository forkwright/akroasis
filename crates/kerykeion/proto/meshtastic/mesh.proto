syntax = "proto3";
package meshtastic;

import "meshtastic/portnums.proto";
import "meshtastic/telemetry.proto";
import "meshtastic/channel.proto";

// Hardware model identifiers.
enum HardwareModel {
  UNSET = 0;
  TLORA_V2 = 1;
  TLORA_V1 = 2;
  TLORA_V2_1_1P6 = 3;
  TBEAM = 4;
  HELTEC_V2_0 = 5;
  TBEAM_V0P7 = 6;
  T_ECHO = 7;
  TLORA_V1_3 = 8;
  RAK4631 = 9;
  HELTEC_V2_1 = 10;
  HELTEC_V1 = 11;
  LILYGO_TBEAM_S3_CORE = 12;
  RAK11200 = 13;
  NANO_G1 = 14;
  TLORA_V2_1_1P8 = 15;
  TLORA_T3_S3 = 16;
  NANO_G1_EXPLORER = 17;
  NANO_G2_ULTRA = 18;
  LORA_TYPE = 19;
  WIPHONE = 20;
  WIO_WM1110 = 21;
  RAK2560 = 22;
  HELTEC_HRU_3601 = 23;
  STATION_G1 = 24;
  STATION_G2 = 25;
  LORA_RELAY_V1 = 26;
  NRF52840DK = 27;
  PPR = 28;
  GENIEBLOCKS = 29;
  NRF52_UNKNOWN = 30;
  PORTDUINO = 31;
  ANDROID_SIM = 32;
  DIY_V1 = 33;
  NRF52840_PCA10059 = 34;
  DR_DEV = 35;
  M5STACK = 36;
  HELTEC_V3 = 37;
  HELTEC_WSL_V3 = 38;
  BETAFPV_2400_TX = 39;
  BETAFPV_900_NANO_TX = 40;
  RPI_PICO = 41;
  HELTEC_WIRELESS_TRACKER = 42;
  HELTEC_WIRELESS_PAPER = 43;
  T_DECK = 44;
  T_WATCH_S3 = 45;
  PICOMPUTER_S3 = 46;
  HELTEC_HT62 = 47;
  EBYTE_ESP32_S3 = 48;
  ESP32_S3_PICO = 49;
  PRIVATE_HW = 255;
}

// GPS position data.
message Position {
  sint32 latitude_i = 1;
  sint32 longitude_i = 2;
  int32 altitude = 3;
  uint32 time = 4;
  uint32 location_source = 5;
  uint32 altitude_source = 6;
  uint32 timestamp = 7;
  int32 timestamp_millis_adjust = 8;
  int32 altitude_hae = 9;
  int32 altitude_geoidal_separation = 10;
  uint32 pdop = 11;
  uint32 hdop = 12;
  uint32 vdop = 13;
  uint32 gps_accuracy = 14;
  uint32 ground_speed = 15;
  uint32 ground_track = 16;
  uint32 fix_quality = 17;
  uint32 fix_type = 18;
  uint32 sats_in_view = 19;
  uint32 sensor_id = 20;
  uint32 next_update = 21;
  uint32 seq_number = 22;
  int32 precision_bits = 23;
}

// User profile information for a mesh node.
message User {
  string id = 1;
  string long_name = 2;
  string short_name = 3;
  bytes macaddr = 4;
  HardwareModel hw_model = 6;
  bool is_licensed = 7;
  uint32 role = 8;
}

// Route discovery data for traceroute packets.
message RouteDiscovery {
  repeated uint32 route = 2;
  repeated int32 snr_towards = 3;
  repeated uint32 back = 4;
  repeated int32 snr_back = 5;
}

// Routing error codes and route discovery payloads.
message Routing {
  enum Error {
    NONE = 0;
    NO_ROUTE = 1;
    GOT_NAK = 2;
    TIMEOUT = 3;
    NO_INTERFACE = 4;
    MAX_RETRANSMIT = 5;
    NO_CHANNEL = 6;
    TOO_LARGE = 7;
    NO_RESPONSE = 8;
    DUTY_CYCLE_LIMIT = 9;
    BAD_REQUEST = 32;
    NOT_AUTHORIZED = 33;
  }
  oneof variant {
    RouteDiscovery route_request = 1;
    RouteDiscovery route_reply = 2;
    Error error_reason = 3;
  }
}

// Application-layer data payload.
message Data {
  PortNum portnum = 1;
  bytes payload = 2;
  bool want_response = 3;
  uint32 dest = 4;
  uint32 source = 5;
  uint32 request_id = 6;
  uint32 reply_id = 7;
  bytes emoji = 8;
}

// A packet on the mesh network.
message MeshPacket {
  enum Priority {
    UNSET = 0;
    MIN = 1;
    BACKGROUND = 10;
    DEFAULT = 64;
    RELIABLE = 70;
    ACK = 120;
    MAX = 127;
  }
  uint32 from = 1;
  uint32 to = 2;
  uint32 channel = 3;
  oneof payload_variant {
    Data decoded = 4;
    bytes encrypted = 5;
  }
  uint32 id = 6;
  uint32 rx_time = 7;
  float rx_snr = 8;
  uint32 hop_limit = 10;
  bool want_ack = 11;
  Priority priority = 12;
  int32 rx_rssi = 13;
  bool via_mqtt = 17;
  uint32 hop_start = 18;
}

// Information about a single mesh node.
message NodeInfo {
  uint32 num = 1;
  User user = 2;
  Position position = 3;
  float snr = 4;
  uint32 last_heard = 5;
  DeviceMetrics device_metrics = 6;
  uint32 channel = 7;
  bool via_mqtt = 8;
  uint32 hops_away = 9;
  bool is_favorite = 10;
}

// Sent to the radio to initiate config sync.
message MyNodeInfo {
  uint32 my_node_num = 1;
}

// Message sent from the host to the radio.
message ToRadio {
  oneof payload_variant {
    MeshPacket packet = 1;
    uint32 want_config_id = 3;
    bool disconnect = 4;
  }
}

// Message received from the radio.
message FromRadio {
  uint32 id = 1;
  oneof payload_variant {
    MeshPacket packet = 2;
    MyNodeInfo my_info = 3;
    NodeInfo node_info = 4;
    uint32 config_complete_id = 8;
    bool rebooted = 9;
    Channel channel = 10;
  }
}
