[package]
name = "syntonia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Opt-in hardware serial backend. Requires `libudev-dev` on Linux; off by
# default so the crate can build in minimal CI/container environments.
hardware-serial = ["dep:serialport"]

[dependencies]
koinon = { path = "../koinon" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
csv = { workspace = true }
snafu = { workspace = true }
compact_str = { workspace = true }
tracing = { workspace = true }
rusb = { workspace = true }
serialport = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
serde = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
